name: collect

# Every 15 minutes. The feed carries the full network state on each fetch, so a
# missed run costs only the stops that were inside its window. GitHub queues
# scheduled jobs under load, meaning the actual spacing varies and the archive
# must never assume an exact grid.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# A late run must not overlap the next one, otherwise both push and one loses.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector dependencies
        run: pip install -r requirements-collect.txt

      - name: Fetch snapshot
        run: PYTHONPATH=src python -m vbb_realtime_archive.collect

      - name: Commit snapshot
        run: |
          git config user.name "vbb-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "data: snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Another run may have pushed while this one was working.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1
